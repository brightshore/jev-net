name: CI

# README.md is deliberately NOT ignored below: its C# blocks are checked against compiled source by ReadmeTests,
# and a README-only change is exactly the one that check exists for.
on:
  push:
    branches: [main]
    paths-ignore: ['CHANGELOG.md', 'SECURITY.md', '.changeset/**', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['CHANGELOG.md', 'SECURITY.md', '.changeset/**', 'LICENSE', 'NOTICE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux always. Windows because paths, line endings and culture are where a port usually slips.
        # No macOS leg: it bills at 10x and nothing here is platform-specific enough to pay for it.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build (warnings are errors; both target frameworks)
        run: dotnet build Jev.Net.slnx --configuration Release -p:ContinuousIntegrationBuild=true -p:JevTestAllFrameworks=true
      # Offline by construction: the live tests need TYPESAFE_LIVE_TESTS=1 AND a key, and CI sets neither.
      # The build above passed -p:JevTestAllFrameworks=true, so this runs the suite on net8.0 AND net10.0.
      - name: Test (net8.0 + net10.0)
        run: dotnet test --solution Jev.Net.slnx --configuration Release --no-build
      # IsAotCompatible only proves the analyzers are quiet. This publishes a real native binary and runs it:
      # request encoding, a retry, answers filled by property name (the one place the library reflects),
      # source-generated JSON and error mapping, all AFTER the trimmer and the AOT compiler have had their way.
      - name: Native AOT smoke (publish + run)
        shell: bash
        run: |
          dotnet publish tests/Jev.Net.AotSmoke --configuration Release --output aot
          ./aot/Jev.Net.AotSmoke

      - name: Pack (assembles the package, and diffs its public API against the last release)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/Jev.Net/Jev.Net.csproj --configuration Release --no-build --output artifacts
      - name: API baseline is the latest published version
        if: matrix.os == 'ubuntu-latest'
        run: scripts/check-baseline.sh

      - name: One dependency, as promised
        if: matrix.os == 'ubuntu-latest'
        run: scripts/check-dependencies.sh artifacts/*.nupkg

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*
